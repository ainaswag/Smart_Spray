<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawalan Spray</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
        }
        .btn-spray {
            background-color: #2196F3;
            color: white;
            font-size: 20px;
            font-weight: bold;
            padding: 20px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
            margin: 10px;
        }
        .btn-spray:active {
            background-color: #0b7dda;
            transform: scale(0.95);
        }
        #status-teks {
            margin-top: 20px;
            font-size: 16px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Panel Kawalan Spray</h2>
        
        <!-- Butang untuk panggil API Blynk -->
        <button class="btn-spray" onclick="aktifkanSpray()">Sembur</button>
        
        <div id="status-teks">Status: Bersedia</div>
    </div>

    <script>
        async function aktifkanSpray() {
            const statusDiv = document.getElementById("status-teks");
            statusDiv.innerText = "Status: Menghantar arahan...";

            // URL API Blynk anda untuk set V0 kepada 1 (ON)
            const apiUrl = "https://sgp1.blynk.cloud/external/api/update?token=MMvmYyeidQMm0zShvwSRujg-CVuW66Sd&v0=1"; 

            try {
                // Tukar method kepada 'GET' kerana Blynk API menggunakan GET untuk update nilai
                const response = await fetch(apiUrl, {
                    method: 'GET'
                });

                if (response.ok) {
                    statusDiv.innerText = "Status: Berjaya! Spray diaktifkan.";
                } else {
                    statusDiv.innerText = "Status: Gagal menghubungi pelayan Blynk.";
                }
            } catch (error) {
                console.error("Ralat:", error);
                statusDiv.innerText = "Status: Ralat sambungan rangkaian.";
            }
        }
    </script>

</body>
</html>
